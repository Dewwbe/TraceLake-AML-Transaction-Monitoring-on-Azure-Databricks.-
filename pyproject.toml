[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-monitoring-lakehouse"
version = "0.1.0"
description = "AML transaction monitoring and sanctions-screening lakehouse (Azure Databricks, Delta Lake, Airflow)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# pyspark, pandas and pyarrow are provided by the Databricks Runtime; install them only for local runs.
local = ["pyspark>=3.5", "pandas>=2.0,<3", "pyarrow>=14.0"]
dev = ["pyspark>=3.5", "pandas>=2.0,<3", "pyarrow>=14.0", "pytest>=8.0", "ruff>=0.5", "build>=1.0"]
dashboard = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9", "pandas>=2.0,<3", "pyarrow>=14.0"]
airflow = ["apache-airflow>=2.7", "apache-airflow-providers-databricks>=6.0"]

[project.scripts]
aml-stage = "aml.jobs.run_stage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
